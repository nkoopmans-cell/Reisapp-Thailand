<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Thailand">
  <meta name="theme-color" content="#F5F7F1">
  <title>Thailand Rondreis</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&display=swap">
  
  <style>
    :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
    body{margin:0;font-size:14px}
    img{max-width:100%}[hidden]{display:none!important}
    
    /* Layout variabelen */
    :root {
      --paper: #F5F7F1; --card: #FFFFFF; --ink: #15232C; --muted: #5A6A6E; --line: #DCE3DA; --soft: #EAF0E6;
      --sea: #CADDE3; --land: #EDEEE6; --thai: #E1EAD2; --border: #93A796; --prov: #C6D3BD; --road: #C8B79C; --river: #9CC2CF;
      --accent: #D27D22; --accent-ink: #FFFFFF; --food: #A8396A; --food-ink: #FFFFFF; --hotel: #1E3A56; --hotel-ink: #FFFFFF;
      --flight: #1E3A56; --roadleg: #A3432A; --boat: #17807F; --rail: #6B4E8C; --slow: #4C8738;
      --danger: #B3362A; --shadow: 0 1px 2px rgba(21,35,44,.08), 0 6px 24px rgba(21,35,44,.10);
      --f-display: "Young Serif", Georgia, "Times New Roman", serif;
      --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --paper: #10181D; --card: #172229; --ink: #E7EDE8; --muted: #93A3A4; --line: #2A3A3F; --soft: #1C2A2F;
      --sea: #0D2029; --land: #1A2327; --thai: #23332B; --border: #4B6356; --prov: #2F4237; --road: #5A503F; --river: #24505E;
      --accent: #EE9D45; --accent-ink: #1A1206; --hotel: #8DB4DE; --hotel-ink: #0E1A25; --food: #E886AF; --food-ink: #2A0B18;
      --flight: #9CC3EA; --roadleg: #E7835D; --boat: #4CC6C2; --rail: #B9A0DA; --slow: #8BC877;
      --danger: #F07A6C; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.4); color-scheme: dark; } }

    /* Map / Leaflet benodigde stijlen */
    .leaflet-pane, .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow, .leaflet-tile-container, .leaflet-pane > svg, .leaflet-pane > canvas, .leaflet-zoom-box, .leaflet-image-layer, .leaflet-layer { position: absolute; left: 0; top: 0; }
    .leaflet-container { overflow: hidden; -webkit-tap-highlight-color: transparent; }
    .leaflet-tile, .leaflet-marker-icon, .leaflet-marker-shadow { -webkit-user-select: none; -moz-user-select: none; user-select: none; -webkit-user-drag: none; }
    .leaflet-tile::selection { background: transparent; }
    .leaflet-safari .leaflet-tile { image-rendering: -webkit-optimize-contrast; }
    .leaflet-safari .leaflet-tile-container { width: 1600px; height: 1600px; -webkit-transform-origin: 0 0; }
    .leaflet-marker-icon, .leaflet-marker-shadow { display: block; }
    .leaflet-container .leaflet-overlay-pane svg { max-width: none !important; max-height: none !important; }
    .leaflet-container .leaflet-marker-pane img, .leaflet-container .leaflet-shadow-pane img, .leaflet-container .leaflet-tile-pane img, .leaflet-container img.leaflet-image-layer, .leaflet-container .leaflet-tile { max-width: none !important; max-height: none !important; width: auto; padding: 0; }
    .leaflet-container img.leaflet-tile { mix-blend-mode: plus-lighter; }
    .leaflet-container.leaflet-touch-zoom { -ms-touch-action: pan-x pan-y; touch-action: pan-x pan-y; }
    .leaflet-container.leaflet-touch-drag { -ms-touch-action: pinch-zoom; touch-action: none; touch-action: pinch-zoom; }
    .leaflet-container.leaflet-touch-drag.leaflet-touch-zoom { -ms-touch-action: none; touch-action: none; }
    .leaflet-container a { -webkit-tap-highlight-color: rgba(51, 181, 229, 0.4); }
    .leaflet-tile { filter: inherit; visibility: hidden; }
    .leaflet-tile-loaded { visibility: inherit; }
    .leaflet-zoom-box { width: 0; height: 0; box-sizing: border-box; z-index: 800; }
    .leaflet-overlay-pane svg { -moz-user-select: none; }
    .leaflet-pane { z-index: 400; }
    .leaflet-tile-pane { z-index: 200; }
    .leaflet-overlay-pane { z-index: 400; }
    .leaflet-shadow-pane { z-index: 500; }
    .leaflet-marker-pane { z-index: 600; }
    .leaflet-tooltip-pane { z-index: 650; }
    .leaflet-popup-pane { z-index: 700; }
    .leaflet-map-pane canvas { z-index: 100; }
    .leaflet-map-pane svg { z-index: 200; }
    .leaflet-control { position: relative; z-index: 800; pointer-events: auto; float: left; clear: both; }
    .leaflet-top, .leaflet-bottom { position: absolute; z-index: 1000; pointer-events: none; }
    .leaflet-top { top: 0; }
    .leaflet-right { right: 0; }
    .leaflet-bottom { bottom: 0; }
    .leaflet-left { left: 0; }
  </style>
</head>
<body>

  <!-- HIER KOMT DE REST VAN JOUW HTML (Je reis-inhoud, invoervelden, kaarten, etc.) -->
  
  <!-- VOORBEELD INVOERVELD (Zorg dat jouw invoerveld id="mijnInvoer" heeft) -->
  <div style="padding: 20px; text-align: center;">
    <input type="text" id="mijnInvoer" placeholder="Typ hier reisplannen..." style="padding: 10px; width: 80%; max-width: 400px; font-size: 16px;">
  </div>


  <!-- Firebase synchronisatie script (veilig onderaan geplaatst) -->
  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getDatabase, ref, set, onValue } from "https://gstatic.com";

    // Firebase configuratie specifiek voor jouw Reisapp Thailand
    const firebaseConfig = {
	apiKey: "AIzaSyAh6kuIOLZYxt7tr53CbeRlag2YzQnrMNU",
   	authDomain: "reisapp---thailand.firebaseapp.com",
      	databaseURL: "https://firebasedatabase.app", // Toegevoegde database link
      	projectId: "reisapp---thailand",
  	storageBucket: "reisapp---thailand.firebasestorage.app",
  	messagingSenderId: "285284235873",
  	appId: "1:285284235873:web:183f3a77070a183f000820",
  	measurementId: "G-WDFPZ3K38H"

  	
    };

    // Start verbinding met Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const dbRef = ref(database, 'reisGegevens');

    // 1. LIVE LUISTEREN: Update laptop/telefoon zodra de database verandert
    onValue(dbRef, (snapshot) => {
      const data = snapshot.val();
      if (data && data.tekst !== undefined) {
        const inputVeld = document.getElementById("mijnInvoer");
        if (inputVeld && document.activeElement !== inputVeld) {
          inputVeld.value = data.tekst;
        }
      }
    });

    // 2. LIVE VERSTUREN: Stuur tekst direct naar de cloud zodra je typt
    const inputVeld = document.getElementById("mijnInvoer");
    if (inputVeld) {
      inputVeld.addEventListener('input', (e) => {
        set(dbRef, {
          tekst: e.target.value
        });
      });
    }
  </script>
</body>
</html>
